<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фонарик</title>
    <link rel="stylesheet" href="css/everywhereS.css">
    <link rel="icon" href="img/favicon/favbg.svg" type="image/x-icon">
</head>
<body>

    <!-- Оверлей для горизонтальной ориентации -->
    <div class="rotate-hint" id="rotateHint">
        <svg class="rotate-hint__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.17-.59-.73-1-1.36-1-1.14 0-2.07.93-2.07 2.07 0 .32.08.62.21.89L3.79 7.93C2.09 9.3 1 11.52 1 14c0 4.42 3.58 8 8 8h1.5c-3.31 0-6-2.69-6-6 0-1.66.67-3.16 1.76-4.24l1.79 1.79c-.59.59-.95 1.4-.95 2.29 0 1.76 1.43 3.19 3.19 3.19s3.19-1.43 3.19-3.19c0-.89-.36-1.7-.95-2.29l3.57-3.57c.27.13.57.21.89.21 1.14 0 2.07-.93 2.07-2.07 0-.63-.41-1.19-1-1.36L10.23 1.75z"/>
        </svg>
        <p class="rotate-hint__text">Пожалуйста, поверните устройство<br>вертикально</p>
    </div>

    <header class="header">
        <div class="container header__container">
            <h2 class="header__title">Фонарик</h2>

            <figure class="instruction">
                <img src="img/header/beaverFlashlight.png" alt="Бобёр" class="instruction__img">
                <figcaption class="instruction__text">
                    Бобёр построил себе настоящую палатку для чтения.
                    Чтобы лучше видеть картинки в книжке, он подсвечивает их фонариком.
                    Давай сыграем с ним: проведи пальцем по тёмному экрану,
                    найди все спрятанные картинки, произнеси их названия,
                    правильно произнося звук «С». Удачи!
                </figcaption>
            </figure>
        </div>
    </header>

    <main class="main-content">
        <section class="figures torch" id="torch">
            <div class="figures__container back area" id="figuresContainer">
                <canvas id="dots"></canvas>
            </div>
        </section>

        <div class="refresh-wrap">
            <button class="refresh-btn" id="refreshBtn" aria-label="Ещё раз">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                <span>Ещё раз</span>
            </button>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="js/game.js"></script>
    <script src="js/everywhereS.js"></script>
    <script src="js/flashlight.js"></script>
</body>
</html>
